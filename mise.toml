[tools]
biome = "latest"
"github:vladopajic/go-test-coverage" = "latest"
go = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
golangci-lint = "latest"
jactionlint = "latest"
node = "latest"
shellcheck = "latest"

[tasks.fmt]
description = "Format the Go code (gofumpt, golines) and the page's files (Biome)"
run = [
    "golangci-lint fmt",
    "biome check --write",
]

[tasks."fmt:check"]
description = "Fail if any Go file is not formatted"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "Lint the Go code (golangci-lint)"
run = [
    "golangci-lint config verify",
    "golangci-lint run",
]

[tasks."lint:web"]
description = "Lint the page's files and check their formatting (Biome)"
run = "biome ci --error-on-warnings"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows (jactionlint, shellcheck)"
run = "jactionlint --shellcheck=shellcheck"

[tasks.test]
description = "Run the Go tests with the race detector and write coverage.out"
run = "go test -race -coverprofile=coverage.out ./..."

[tasks."test:web"]
description = "Run the page's script tests, fail below 80% of lines covered, write lcov.info"
run = '''
node --test --experimental-test-coverage \
  --test-coverage-include='internal/phonedoor/static/*.js' --test-coverage-lines=80 \
  --test-reporter=spec --test-reporter-destination=stdout \
  --test-reporter=lcov --test-reporter-destination=lcov.info \
  'internal/phonedoor/*.test.js'
'''

[tasks.cover]
description = "Fail if test coverage is below the thresholds (go-test-coverage)"
depends = ["test"]
run = "go-test-coverage --config=.testcoverage.yml"

[tasks.vuln]
description = "Scan the dependencies for known vulnerabilities (govulncheck)"
run = "govulncheck ./..."

[tasks.check]
description = "Run the local quality gate"
depends = ["fmt:check", "lint", "lint:web", "lint:actions", "cover", "test:web", "vuln"]

[tasks.serve]
description = "Run nudge serve from the source, with the settings in mise.local.toml"
run = "go run . serve"

[tasks.icons]
description = "Render the app icon's PNGs from internal/phonedoor/static/icon.svg (resvg)"
tools.resvg = "latest"
run = [
    "resvg -w 180 -h 180 internal/phonedoor/static/icon.svg internal/phonedoor/static/apple-touch-icon.png",
    "resvg -w 192 -h 192 internal/phonedoor/static/icon.svg internal/phonedoor/static/icon-192.png",
    "resvg -w 512 -h 512 internal/phonedoor/static/icon.svg internal/phonedoor/static/icon-512.png",
]

[tasks.sonar-issues]
description = "List open SonarQube Cloud issues"
usage = '''
arg "[pr]" help="Pull request number; without it, the issues on main"
'''
shell = "bash -c"
run = '''
set -euo pipefail
api="https://sonarcloud.io/api"
key=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
target="project '${key}'"
scope=""
if [[ -n "${usage_pr+set}" ]]; then
  if [[ ! "${usage_pr}" =~ ^[1-9][0-9]*$ ]]; then
    echo "error: pull request must be a positive integer, got '${usage_pr}'" >&2
    exit 1
  fi
  target+=", pull request '${usage_pr}'"
  scope="&pullRequest=${usage_pr}"
fi

if ! curl -sSf "${api}/components/show?component=${key}${scope}" >/dev/null; then
  echo "error: cannot read SonarQube Cloud ${target}" >&2
  exit 1
fi

curl -sSf "${api}/issues/search?componentKeys=${key}&resolved=false&ps=200${scope}" |
  jq -r --arg key "${key}" '
    [.issues[] | {
      impacts: ([.impacts[] | "\(.softwareQuality):\(.severity)"] | sort | join(",")),
      rule,
      path: (.component | ltrimstr($key + ":")),
      line: (.line // 0),
      message
    }]
    | sort_by(.path, .line)[]
    | "\(.impacts)\t\(.rule)\t\(.path)\tL\(.line)\t\(.message)"'
'''
