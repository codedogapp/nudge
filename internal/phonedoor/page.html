<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<title>nudge</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/main.js"></script>
</head>
<body data-push-key="{{.PushKey}}">
<header>
<h1>nudge</h1>
<p id="push-state" class="push" hidden></p>
<button id="push" class="push" type="button" hidden>Turn on notifications</button>
</header>
<main>
<p id="push-failure" role="alert" hidden></p>
{{- with .Refusal}}
<p role="alert">{{.}}</p>
{{- end}}
{{- range .Questions}}
<article>
{{- with .Project}}
<p class="project">{{.}}</p>
{{- end}}
<h2>{{.Text}}</h2>
{{- with .Details}}
<p class="details">{{.}}</p>
{{- end}}
<form method="post" action="/questions/{{.ID}}/answer">
{{- range .Options}}
<button name="option" value="{{.}}" type="submit" formnovalidate>{{.}}</button>
{{- end}}
<label>Reply <textarea name="text" rows="3" required></textarea></label>
<button class="primary" type="submit">Send the reply</button>
</form>
</article>
{{- else}}
<p class="empty">No question waits for an answer.</p>
{{- end}}
</main>
</body>
</html>
