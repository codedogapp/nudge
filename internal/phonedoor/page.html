<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<title>nudge</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<h1>nudge</h1>
</header>
<main>
{{- with .Refusal}}
<p role="alert">{{.}}</p>
{{- end}}
{{- range .Questions}}
<article>
{{- with .Project}}
<p class="project">{{.}}</p>
{{- end}}
<h2>{{.Text}}</h2>
{{- with .Details}}
<p class="details">{{.}}</p>
{{- end}}
<form method="post" action="/questions/{{.ID}}/answer">
{{- range .Options}}
<button name="option" value="{{.}}" formnovalidate>{{.}}</button>
{{- end}}
<label>Reply <textarea name="text" rows="3" required></textarea></label>
<button class="primary">Send the reply</button>
</form>
</article>
{{- else}}
<p class="empty">No question waits for an answer.</p>
{{- end}}
</main>
</body>
</html>
